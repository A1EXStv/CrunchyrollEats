<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Test Order Update</title>
</head>

<body>
    <h1>Test de Actualización de Pedido</h1>

    <form id="testForm">
        <label>ID Pedido: <input type="number" id="testId" value="1"></label><br><br>
        <label>Estado:
            <select id="testEstado">
                <option value="pendiente">Pendiente</option>
                <option value="procesando">Procesando</option>
                <option value="enviado">Enviado</option>
                <option value="completado">Completado</option>
                <option value="cancelado">Cancelado</option>
            </select>
        </label><br><br>
        <button type="submit">Actualizar Estado</button>
    </form>

    <div id="result" style="margin-top: 20px; padding: 10px; border: 1px solid #ccc;"></div>

    <script>
        document.getElementById('testForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const id = document.getElementById('testId').value;
            const estado = document.getElementById('testEstado').value;
            const resultDiv = document.getElementById('result');

            resultDiv.innerHTML = 'Enviando...';

            try {
                const response = await fetch('../../index.php?controller=Api&action=updatePedidoEstado', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        id_pedido: parseInt(id),
                        estado: estado
                    }),
                    credentials: 'include'
                });

                const data = await response.json();

                resultDiv.innerHTML = `
                    <h3>Respuesta del servidor:</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                    <p>Status HTTP: ${response.status}</p>
                `;

                console.log('Response:', data);
            } catch (error) {
                resultDiv.innerHTML = `
                    <h3>Error:</h3>
                    <pre>${error.message}</pre>
                `;
                console.error('Error:', error);
            }
        });
    </script>
</body>

</html>
